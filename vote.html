<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rate Tanks HTML</title>

    <!-- CSS stuff -->
    <link rel="stylesheet" href="index.css" />

    <!-- Bootstrap Framework -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous" />

    <!-- Bootstrap Framework -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous" />

    <!-- Bebas Neue Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-dark">
            <div class="container-fluid d-flex align-items-center flex-nowrap overflow-auto">
                <div class="d-flex align-items-center">
                    <a class="navbar-brand mb-0" href="index.html">Rate Tanks</a>
                    <div class="vr text-white mx-3" style="height: 58px; width: 3px; opacity: 1;"></div>
                    <ul class="navbar-nav d-flex flex-row flex-nowrap">
                        <li class="nav-item">
                            <a class="nav-link text-white-50 text-nowrap" href="scores.html">Scores</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active text-white text-nowrap" href="vote.html">Vote</a>
                        </li>
                    </ul>
                </div>
                <div class="d-flex ms-auto">
                    <span class="text-white text-nowrap d-none d-sm-inline">User: Username</span>
                </div>
            </div>
        </nav>
    </header>

    <body>
        <div class="d-flex">
            <h3> Votes Left: 3/3</h3>
            <h3 class="right ms-auto">Rate: Select 3 tanks to vote for</h3>
        </div>
        <main>
            <div class="tank-list">
                <div class="tank-item">
                    <img class="tank-image" src="Resources/Tank Images/Tiger II.jpg" alt="Tiger II" width="140">
                    <span class="tank-name">Pz.Kpfw. Tiger Ausf. B (King Tiger)</span>
                    <img class="flag-image" src="Resources/Flag Images/German Flag.png" alt="Germany Flag" width="130">
                </div>
                <div class="tank-item">
                    <img class="tank-image" src="Resources/Tank Images/Tiger I.jpg" alt="Tiger I" width="110">
                    <span class="tank-name">Pz.Kpfw. Tiger Ausf. I (Tiger I)</span>
                    <img class="flag-image" src="Resources/Flag Images/German Flag.png" alt="Germany Flag" width="130">
                </div>
                <div class="tank-item">
                    <img class="tank-image" src="Resources/Tank Images/Sherman Jumbo.jpg" alt="Sherman Jumbo"
                        width="110">
                    <span class="tank-name">M4A3E2 Sherman Jumbo</span>
                    <img class="flag-image" src="Resources/Flag Images/American Flag.png" alt="US Flag" width="130">
                </div>
                <div class="tank-item">
                    <img class="tank-image" src="Resources/Tank Images/Sherman VC.jpg" alt="Sherman VC" width="110">
                    <span class="tank-name">M4A3E8 Sherman VC</span>
                    <img class="flag-image" src="Resources/Flag Images/American Flag.png" alt="US Flag" width="130">
                </div>
            </div>
        </main>

    </body>

    <footer class="bg-dark text-white-50">
        <div class="container-fluid d-flex align-items-center">
            <span class="text-reset">Isaac Garner</span>
            <div class="vr mx-3"></div>
            <a class="text-reset" href="https://github.com/webprogramming260/simon-css">GitHub</a>
        </div>
    </footer>

</html>
